name: Finance transaction operation SQL runtime

on:
  pull_request:
    paths:
      - '.github/workflows/finance-transaction-operation-runtime.yml'
      - 'supabase/migrations/0274_finance_transaction_operation_receipts.sql'
      - 'tests/fixtures/0274-finance-transaction-operation-*'
      - 'lib/services/finances/**'
      - 'lib/ai/tools/finances.ts'
      - 'lib/ai/tools/execute.ts'
      - 'lib/services/types.ts'
      - 'lib/database.types.ts'

permissions:
  contents: read

concurrency:
  group: finance-operation-sql-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finance-operation-sql:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the exact same-repository PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Start isolated synthetic PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          container="bubaly-finance-operation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'FINANCE_OPERATION_CONTAINER=%s\n' "$container" >> "$GITHUB_ENV"
          docker run --detach --name "$container" --network none --log-driver none \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env POSTGRES_DB=bubaly_finance_operation_ci \
            postgres:17 -c listen_addresses='' > /dev/null
          # `pg_isready` does NOT connect — it asks the postmaster whether it is
          # accepting connections and nothing more, so it reports success while
          # the database named in --dbname does not exist. Measured directly:
          #
          #   $ pg_isready --dbname=this_database_does_not_exist
          #   /tmp/pgaudit_db:54399 - accepting connections     (exit 0)
          #   $ psql --dbname=this_database_does_not_exist -c 'select 1'
          #   (exit 2)
          #
          # That is how run 35449163939 went green here and then failed one
          # second later with `database "bubaly_finance_operation_ci" does not
          # exist`: a readiness gate that could not fail for the thing it was
          # named for — the shape this whole audit is about, in the audit's own
          # CI. The gate now opens a REAL connection to the REAL database.
          #
          # Three CONSECUTIVE successes, because the postgres image runs a
          # temporary server on this same socket during initialisation to create
          # POSTGRES_DB and run init scripts, then stops it and starts the real
          # one. A single success can land on that temporary server and be
          # followed by "the database system is shutting down". Any failure
          # resets the count, so the restart window cannot be straddled.
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$container" psql -X --quiet --no-password \
              --output=/dev/null --host=/var/run/postgresql --username=postgres \
              --dbname=bubaly_finance_operation_ci --command='select 1' 2>/dev/null; then
              ready=$((ready + 1))
              if [ "$ready" -ge 3 ]; then exit 0; fi
            else
              ready=0
            fi
            sleep 1
          done
          printf '%s\n' 'Dedicated synthetic PostgreSQL did not become ready.' >&2
          exit 1

      - name: Apply minimal physical bootstrap and actual migration 0274
        shell: bash
        run: |
          set -euo pipefail
          pg() {
            docker exec -i "$FINANCE_OPERATION_CONTAINER" psql -X --quiet \
              --output=/dev/null --file=- --no-password --host=/var/run/postgresql \
              --username=postgres --dbname=bubaly_finance_operation_ci \
              --set=ON_ERROR_STOP=1 --set=VERBOSITY=terse --set=SHOW_CONTEXT=never
          }
          pg < tests/fixtures/0274-finance-transaction-operation-bootstrap.sql
          pg < supabase/migrations/0274_finance_transaction_operation_receipts.sql

      - name: Exercise atomic writes, receipt-only probes, binding and historical replay
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$FINANCE_OPERATION_CONTAINER" psql -X --quiet \
            --output=/dev/null --file=- --no-password --host=/var/run/postgresql \
            --username=postgres --dbname=bubaly_finance_operation_ci \
            --set=ON_ERROR_STOP=1 --set=VERBOSITY=terse --set=SHOW_CONTEXT=never \
            < tests/fixtures/0274-finance-transaction-operation-runtime.sql

      - name: Exercise real independent-session concurrency and reclaimed retry
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$FINANCE_OPERATION_CONTAINER" psql -X --quiet \
            --output=/dev/null --file=- --no-password --host=/var/run/postgresql \
            --username=postgres --dbname=bubaly_finance_operation_ci \
            --set=ON_ERROR_STOP=1 --set=VERBOSITY=terse --set=SHOW_CONTEXT=never \
            < tests/fixtures/0274-finance-transaction-operation-concurrency.sql

      - name: Remove only this run's synthetic container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected="bubaly-finance-operation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "${FINANCE_OPERATION_CONTAINER:-}" = "$expected" ]; then
            docker rm --force "$expected" > /dev/null 2>&1 || true
          fi
