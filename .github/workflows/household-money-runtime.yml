name: Household money SQL runtime

# The held 0514 (supabase/reserved/) replaces the read on twelve tables of the
# household's money and money papers, inside is_family_member(family_id): a
# manager of the row's family on financial_accounts, family_wallets,
# stripe_connected_accounts, stripe_financial_accounts, billing_customers,
# checkout_sessions and babysitter_payments; a manager or the member a
# transaction is tagged to on transactions; a manager or whoever added it on
# home_warranties, auto_insurance_policies, vehicle_registrations and
# paperwork_items. The owner decided it this way. Before it, a teen, a child,
# a caregiver or a guest read the household's balances, purchases, Stripe and
# billing rows, babysitter payouts and paperwork.
# Neither the Database job's replay nor `supabase db push` reads
# supabase/reserved/, and the Database job's probe glob does not read
# docs/audit/reserved/, so nothing else in CI exercises it. This job replays
# every runnable migration with the Database job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect, with no control failing, so a green step 3 is the
#      migration's and not a probe that can no longer see anything;
#   2. applies the held migration twice (it is re-runnable);
#   3. runs the probe again and requires it to pass;
#   4. re-runs the released probes over these tables, and then the held probe
#      once more: wallet-write-rls-check re-runs 0275, which re-creates the
#      family-wide reads on accounts and transactions, and must leave them as
#      it found them.
#
# When 0514 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/household-money-runtime.yml'
      - 'supabase/reserved/0514_household_money_is_a_parents_or_adults.sql'
      - 'docs/audit/reserved/household-money-is-a-parents-or-adults-check.sql'
      - 'docs/audit/a-password-alone-does-not-open-the-familys-vault-check.sql'
      - 'docs/audit/allowance-rule-write-boundary-check.sql'
      - 'docs/audit/checkout-rewards-babysitter-check.sql'
      - 'docs/audit/entitlement-write-boundary-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/money-write-boundary-check.sql'
      - 'docs/audit/paperwork-stamp-concurrency-check.sql'
      - 'docs/audit/paywall-write-boundary-check.sql'
      - 'docs/audit/plpgsql-bodies-resolve-check.sql'
      - 'docs/audit/rls-sweep-check.sql'
      - 'docs/audit/wallet-audit-actor-check.sql'
      - 'docs/audit/wallet-concurrency-check.sql'
      - 'docs/audit/wallet-side-table-write-check.sql'
      - 'docs/audit/wallet-write-rls-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/household-money-runtime.yml'
      - 'supabase/reserved/0514_household_money_is_a_parents_or_adults.sql'
      - 'docs/audit/reserved/household-money-is-a-parents-or-adults-check.sql'
      - 'docs/audit/a-password-alone-does-not-open-the-familys-vault-check.sql'
      - 'docs/audit/allowance-rule-write-boundary-check.sql'
      - 'docs/audit/checkout-rewards-babysitter-check.sql'
      - 'docs/audit/entitlement-write-boundary-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/money-write-boundary-check.sql'
      - 'docs/audit/paperwork-stamp-concurrency-check.sql'
      - 'docs/audit/paywall-write-boundary-check.sql'
      - 'docs/audit/plpgsql-bodies-resolve-check.sql'
      - 'docs/audit/rls-sweep-check.sql'
      - 'docs/audit/wallet-audit-actor-check.sql'
      - 'docs/audit/wallet-concurrency-check.sql'
      - 'docs/audit/wallet-side-table-write-check.sql'
      - 'docs/audit/wallet-write-rls-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: household-money-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  household-money:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema lets every member read the household's money
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/household-money-is-a-parents-or-adults-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect 0514 repairs'
            exit 1
          fi
          for expected in \
            "the teen reads the household's money in 12 of 12 tables" \
            "the child reads the household's money in 12 of 12 tables" \
            "the caregiver reads the household's money in 12 of 12 tables" \
            "the guest reads the household's money in 12 of 12 tables" \
            "the child changed the parent's paperwork item (OK 1)" \
            "the read is not 0514's on financial_accounts"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed on the released schema, but not on: $expected"
              exit 1
            fi
          done
          if grep -qF 'CONTROL' <<<"$out"; then
            echo '::error::a control failed on the released schema, so the failure above is not only the defect'
            exit 1
          fi

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0514_household_money_is_a_parents_or_adults.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0514_household_money_is_a_parents_or_adults.sql

      - name: Household money is a parent's or adult's
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/household-money-is-a-parents-or-adults-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'household-money-is-a-parents-or-adults: OK' <<<"$out"

      - name: The released probes over these tables still hold, and leave 0514 in place
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/a-password-alone-does-not-open-the-familys-vault-check.sql \
            docs/audit/allowance-rule-write-boundary-check.sql \
            docs/audit/checkout-rewards-babysitter-check.sql \
            docs/audit/entitlement-write-boundary-check.sql \
            docs/audit/gated-write-tables-check.sql \
            docs/audit/money-write-boundary-check.sql \
            docs/audit/paperwork-stamp-concurrency-check.sql \
            docs/audit/paywall-write-boundary-check.sql \
            docs/audit/plpgsql-bodies-resolve-check.sql \
            docs/audit/rls-sweep-check.sql \
            docs/audit/wallet-audit-actor-check.sql \
            docs/audit/wallet-concurrency-check.sql \
            docs/audit/wallet-side-table-write-check.sql \
            docs/audit/wallet-write-rls-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/household-money-is-a-parents-or-adults-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'household-money-is-a-parents-or-adults: OK' <<<"$out"
