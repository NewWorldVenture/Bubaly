name: One member one vote SQL runtime

# The held 0501 (supabase/reserved/) wires 0311's reference_shares_family onto
# member_id of family_poll_votes, meal_vote_ballots, watchlist_votes and
# event_rsvps. Their write policies ask is_self_member(member_id), which is not
# bound to a family, so a person active in two families (a child of two
# households) voted a second time in one household under their member id from
# the other. Neither the Database job's replay nor `supabase db push` reads
# supabase/reserved/, and the Database job's probe glob does not read
# docs/audit/reserved/, so nothing else in CI exercises it. This job replays
# every runnable migration with the Database job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect, so a green step 3 is the migration's and not a probe that
#      can no longer see anything;
#   2. applies the held migration twice (it is re-runnable);
#   3. runs the probe again and requires it to pass;
#   4. re-runs the released probes of the same four tables.
#
# When 0501 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/one-member-one-vote-runtime.yml'
      - 'supabase/reserved/0501_one_member_one_vote_in_two_households.sql'
      - 'docs/audit/reserved/one-member-one-vote-in-two-households-check.sql'
      - 'docs/audit/vote-owner-check.sql'
      - 'docs/audit/poll-single-choice-check.sql'
      - 'docs/audit/meal-ballot-is-per-option-check.sql'
      - 'docs/audit/cross-family-reference-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-member-one-vote-runtime.yml'
      - 'supabase/reserved/0501_one_member_one_vote_in_two_households.sql'
      - 'docs/audit/reserved/one-member-one-vote-in-two-households-check.sql'
      - 'docs/audit/vote-owner-check.sql'
      - 'docs/audit/poll-single-choice-check.sql'
      - 'docs/audit/meal-ballot-is-per-option-check.sql'
      - 'docs/audit/cross-family-reference-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: one-member-one-vote-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  one-member-one-vote:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema still lets one person vote twice
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/one-member-one-vote-in-two-households-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect 0501 repairs'
            exit 1
          fi
          for expected in \
            "family_poll_votes: the child cast a poll vote a second time in Mom's house" \
            "meal_vote_ballots: the child cast a dinner ballot a second time in Mom's house" \
            "watchlist_votes: the child cast a watchlist vote a second time in Mom's house" \
            "event_rsvps: the child cast an RSVP a second time in Mom's house"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed on the released schema, but not on: $expected"
              exit 1
            fi
          done

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0501_one_member_one_vote_in_two_households.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0501_one_member_one_vote_in_two_households.sql

      - name: One person votes once in each household
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/one-member-one-vote-in-two-households-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'one-member-one-vote-in-two-households: OK' <<<"$out"

      - name: The released probes of the four tables still hold
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/vote-owner-check.sql \
            docs/audit/poll-single-choice-check.sql \
            docs/audit/meal-ballot-is-per-option-check.sql \
            docs/audit/cross-family-reference-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
