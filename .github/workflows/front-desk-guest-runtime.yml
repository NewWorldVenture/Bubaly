name: Front desk guest SQL runtime

# The held 0520 (supabase/reserved/) completes the owner's decision on
# ROLE-SCOPE-001 (held 0509) for the household inbox: a guest does not read the
# AI Front Desk's call history (call_logs) or the Communications Hub
# (family_communications), the two tables behind withheld pages that 0509's list
# left out. It needs 0509's is_family_guest(). Neither the Database job's replay
# nor `supabase db push` reads supabase/reserved/, and the Database job's probe
# glob does not read docs/audit/reserved/, so nothing else in CI exercises it.
# This job replays every runnable migration with the Database job's bootstrap,
# then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect alone (no CONTROL line), so a green step 5 is the migration's
#      and not a probe that can no longer see anything;
#   2. applies the held 0509, which 0520 needs;
#   3. runs the probe again and requires the same failure: 0509 alone leaves
#      both tables open to a guest;
#   4. applies 0520 twice (it is re-runnable);
#   5. runs the probe again and requires it to pass;
#   6. re-runs 0509's held probe and the released probes over these tables
#      and over the guest guard, each of which passes under both.
#
# When 0520 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/front-desk-guest-runtime.yml'
      - 'supabase/reserved/0520_a_guest_does_not_read_the_front_desks_call_history_or_the_hub.sql'
      - 'docs/audit/reserved/a-guest-does-not-read-the-front-desks-call-history-check.sql'
      - 'supabase/reserved/0509_a_guest_does_not_read_the_households_most_sensitive_areas.sql'
      - 'docs/audit/reserved/a-guest-does-not-read-the-households-most-sensitive-areas-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/realtime-anon-stream-check.sql'
      - 'docs/audit/member-scope-crossing-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/front-desk-guest-runtime.yml'
      - 'supabase/reserved/0520_a_guest_does_not_read_the_front_desks_call_history_or_the_hub.sql'
      - 'docs/audit/reserved/a-guest-does-not-read-the-front-desks-call-history-check.sql'
      - 'supabase/reserved/0509_a_guest_does_not_read_the_households_most_sensitive_areas.sql'
      - 'docs/audit/reserved/a-guest-does-not-read-the-households-most-sensitive-areas-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/realtime-anon-stream-check.sql'
      - 'docs/audit/member-scope-crossing-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: front-desk-guest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  front-desk-guest:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema lets a guest read the call history and the Hub
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-guest-does-not-read-the-front-desks-call-history-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect 0520 repairs'
            exit 1
          fi
          if grep -qF 'CONTROL' <<<"$out"; then
            echo '::error::a control failed on the released schema, not only the defect 0520 repairs'
            exit 1
          fi
          for expected in \
            "the guest reads the household's call history (call_logs: 1 row(s))" \
            "the guest reads the household's Communications Hub (family_communications: 1 row(s))" \
            "the guest read guard is not 0520's on call_logs (missing) | family_communications (missing)"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed, but not on: $expected"
              exit 1
            fi
          done

      - name: Apply the held 0509, which 0520 needs
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0509_a_guest_does_not_read_the_households_most_sensitive_areas.sql

      - name: With 0509 alone a guest still reads both
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-guest-does-not-read-the-front-desks-call-history-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed with 0509 alone, so it can no longer see the defect 0520 repairs'
            exit 1
          fi
          if grep -qF 'CONTROL' <<<"$out"; then
            echo '::error::a control failed with 0509 alone, not only the defect 0520 repairs'
            exit 1
          fi
          for expected in \
            "the guest reads the household's call history (call_logs: 1 row(s))" \
            "the guest reads the household's Communications Hub (family_communications: 1 row(s))" \
            "the guest read guard is not 0520's on call_logs (missing) | family_communications (missing)"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed, but not on: $expected"
              exit 1
            fi
          done

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0520_a_guest_does_not_read_the_front_desks_call_history_or_the_hub.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0520_a_guest_does_not_read_the_front_desks_call_history_or_the_hub.sql

      - name: A guest does not read the front desk's call history or the Hub
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-guest-does-not-read-the-front-desks-call-history-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-guest-does-not-read-the-front-desks-call-history: OK' <<<"$out"

      - name: 0509's probe and the released probes over these tables still hold
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/reserved/a-guest-does-not-read-the-households-most-sensitive-areas-check.sql \
            docs/audit/gated-write-tables-check.sql \
            docs/audit/realtime-anon-stream-check.sql \
            docs/audit/member-scope-crossing-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
