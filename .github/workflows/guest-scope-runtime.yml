name: Guest scope SQL runtime

# The held 0509 (supabase/reserved/) adds one RESTRICTIVE read policy to each of
# 59 household tables (locations, money and cards, medical and insurance,
# Guardian and the household inbox): not a guest of the row's family, or the
# row is about the guest. The owner decided ROLE-SCOPE-001 this way; a
# caregiver and every other role are unchanged. Before it, a guest read the
# household's rows in 51 of the 59 (0481 already closes the other eight).
# Neither the Database job's replay nor `supabase db push` reads
# supabase/reserved/, and the Database job's probe glob does not read
# docs/audit/reserved/, so nothing else in CI exercises it. This job replays
# every runnable migration with the Database job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect, with no control failing, so a green step 3 is the
#      migration's and not a probe that can no longer see anything;
#   2. applies the held migration twice (it is re-runnable);
#   3. runs the probe again and requires it to pass;
#   4. re-runs the released probes over guests and these tables, each of which
#      reads which rule is installed where it must.
#
# When 0509 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/guest-scope-runtime.yml'
      - 'supabase/reserved/0509_a_guest_does_not_read_the_households_most_sensitive_areas.sql'
      - 'docs/audit/reserved/a-guest-does-not-read-the-households-most-sensitive-areas-check.sql'
      - 'docs/audit/a-guest-views-the-household-check.sql'
      - 'docs/audit/member-scope-crossing-check.sql'
      - 'docs/audit/only-a-parent-or-an-adult-clears-the-households-money-warnings-check.sql'
      - 'docs/audit/rls-sweep-check.sql'
      - 'docs/audit/rls-isolation-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/guest-scope-runtime.yml'
      - 'supabase/reserved/0509_a_guest_does_not_read_the_households_most_sensitive_areas.sql'
      - 'docs/audit/reserved/a-guest-does-not-read-the-households-most-sensitive-areas-check.sql'
      - 'docs/audit/a-guest-views-the-household-check.sql'
      - 'docs/audit/member-scope-crossing-check.sql'
      - 'docs/audit/only-a-parent-or-an-adult-clears-the-households-money-warnings-check.sql'
      - 'docs/audit/rls-sweep-check.sql'
      - 'docs/audit/rls-isolation-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: guest-scope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guest-scope:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema lets a guest read the household's sensitive areas
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-guest-does-not-read-the-households-most-sensitive-areas-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect 0509 repairs'
            exit 1
          fi
          for expected in \
            "the guest reads the household's rows in 51 of 59 sensitive tables" \
            "no guest read guard with 0509's exact predicate on 59 of 59 tables"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed on the released schema, but not on: $expected"
              exit 1
            fi
          done
          if grep -qF 'CONTROL' <<<"$out"; then
            echo '::error::a control failed on the released schema, so the failure above is not only the defect'
            exit 1
          fi

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0509_a_guest_does_not_read_the_households_most_sensitive_areas.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0509_a_guest_does_not_read_the_households_most_sensitive_areas.sql

      - name: A guest does not read the household's most sensitive areas
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-guest-does-not-read-the-households-most-sensitive-areas-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-guest-does-not-read-the-households-most-sensitive-areas: OK' <<<"$out"

      - name: The released probes over guests and these tables still hold
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/a-guest-views-the-household-check.sql \
            docs/audit/member-scope-crossing-check.sql \
            docs/audit/only-a-parent-or-an-adult-clears-the-households-money-warnings-check.sql \
            docs/audit/rls-sweep-check.sql \
            docs/audit/rls-isolation-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
