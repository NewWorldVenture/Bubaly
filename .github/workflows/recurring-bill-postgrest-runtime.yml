name: Recurring bill real PostgREST runtime

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/recurring-bill-postgrest-runtime.yml'
      - 'tests/fixtures/recurring-bill-postgrest-bootstrap.sql'
      - 'tests/recurring-bill-postgrest.test.ts'
      - 'lib/finance/**'
      - 'lib/calendar/**'
      - 'supabase/reserved/0488_a_month_end_bill_keeps_its_day.sql'
      - 'supabase/migrations/0003_functions_triggers.sql'
      - 'supabase/migrations/0006_financial_health_school_sports.sql'
      - 'supabase/migrations/0275_money_permissive_write_sweep.sql'
      - 'supabase/migrations/0382_a_password_alone_does_not_delete_the_familys_budget.sql'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/recurring-bill-postgrest-runtime.yml'
      - 'tests/fixtures/recurring-bill-postgrest-bootstrap.sql'
      - 'tests/recurring-bill-postgrest.test.ts'
      - 'lib/finance/**'
      - 'lib/calendar/**'
      - 'supabase/reserved/0488_a_month_end_bill_keeps_its_day.sql'
      - 'supabase/migrations/0003_functions_triggers.sql'
      - 'supabase/migrations/0006_financial_health_school_sports.sql'
      - 'supabase/migrations/0275_money_permissive_write_sweep.sql'
      - 'supabase/migrations/0382_a_password_alone_does_not_delete_the_familys_budget.sql'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'

permissions:
  contents: read

concurrency:
  group: recurring-bill-postgrest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recurring-bill-postgrest:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Official registry manifest digests verified 2026-10-08; no floating REST version.
      BILL_PG_IMAGE: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
      BILL_REST_IMAGE: postgrest/postgrest:v16.4@sha256:d155c6718ed9a9f990d159a2ab7c0a3f16944dbb6d0a0344557421042acfe0df
    steps:
      - name: Check out exact same-repository PR or main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Use declared Node release
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'

      - name: Verify release and install locked development dependencies
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < .nvmrc)" == 24.21.0 && "$(node --version)" == v24.21.0 ]]
          npm ci

      - name: Create only this run's internal network and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ -z "${DOCKER_HOST:-}" && -z "${DOCKER_CONTEXT:-}" ]]
          [[ "$(docker context show)" == default ]]
          [[ "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" == unix:///var/run/docker.sock ]]
          marker="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          prefix="bubaly-bill-rest-${marker}"
          printf 'BUBALY_BILL_GATE_MARKER=%s\n' "$marker" >> "$GITHUB_ENV"
          docker network create --internal --label "bubaly.bill-postgrest-run=$marker" "$prefix-net" > /dev/null
          docker run --detach --name "$prefix-pg" --network "$prefix-net" --network-alias pg \
            --log-driver none --label "bubaly.bill-postgrest-run=$marker" \
            --env POSTGRES_HOST_AUTH_METHOD=trust --env POSTGRES_DB=bubaly_bill_postgrest_ci \
            "$BILL_PG_IMAGE" > /dev/null
          streak=0
          for attempt in $(seq 1 90); do
            if docker exec "$prefix-pg" psql -X --no-password --host=/var/run/postgresql \
              --username=postgres --dbname=bubaly_bill_postgrest_ci --set=ON_ERROR_STOP=1 \
              --output=/dev/null --command='select 1' 2>/dev/null; then
              streak=$((streak + 1))
              if [ "$streak" -ge 3 ]; then exit 0; fi
            else
              streak=0
            fi
            sleep 1
          done
          printf '%s\n' 'Owned bill PostgreSQL never became ready.' >&2
          exit 1

      - name: Bootstrap an empty marked database and start standalone real PostgREST
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${DOCKER_HOST:-}" && -z "${DOCKER_CONTEXT:-}" ]]
          [[ "$(docker context show)" == default ]]
          [[ "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" == unix:///var/run/docker.sock ]]
          marker="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          prefix="bubaly-bill-rest-${marker}"
          [[ "$BUBALY_BILL_GATE_MARKER" == "$marker" ]]
          [[ "$(docker network inspect --format '{{.Internal}}' "$prefix-net")" == true ]]
          [[ "$(docker network inspect --format '{{index .Labels "bubaly.bill-postgrest-run"}}' "$prefix-net")" == "$marker" ]]
          [[ "$(docker inspect --type container --format '{{index .Config.Labels "bubaly.bill-postgrest-run"}}' "$prefix-pg")" == "$marker" ]]
          [[ "$(docker inspect --type container --format '{{.Config.Image}}' "$prefix-pg")" == "$BILL_PG_IMAGE" ]]
          [[ "$(docker inspect --type container --format '{{.HostConfig.NetworkMode}}' "$prefix-pg")" == "$prefix-net" ]]
          [[ -z "$(docker port "$prefix-pg")" ]]
          docker exec -i "$prefix-pg" psql -X --no-password --host=/var/run/postgresql \
            --username=postgres --dbname=bubaly_bill_postgrest_ci --set=ON_ERROR_STOP=1 \
            --set="gate_marker=$marker" --file=- < tests/fixtures/recurring-bill-postgrest-bootstrap.sql
          # Both actors and signing material are disposable fixtures, never external credentials.
          # Internal-only Docker networks do not publish host ports. The test
          # owns a raw loopback TCP relay to the verified REST bridge address.
          docker run --detach --name "$prefix-rest" --network "$prefix-net" \
            --log-driver none --label "bubaly.bill-postgrest-run=$marker" \
            --env PGRST_DB_URI=postgres://bubaly_bill_authenticator@pg:5432/bubaly_bill_postgrest_ci \
            --env PGRST_DB_SCHEMAS=public --env PGRST_DB_ANON_ROLE=anon \
            --env PGRST_DB_CONFIG=false --env PGRST_DB_POOL=8 --env PGRST_DB_MAX_ROWS=2 --env PGRST_DB_CHANNEL_ENABLED=true \
            --env PGRST_SERVER_HOST=0.0.0.0 --env PGRST_SERVER_PORT=3000 \
            --env PGRST_JWT_SECRET=bubaly-bill-gate-synthetic-key-with-no-external-use-20261008 \
            "$BILL_REST_IMAGE" > /dev/null

      - name: Require the complete real service SDK HTTP database acceptance suite
        shell: bash
        env:
          BUBALY_BILL_POSTGREST_GATE: '1'
          BUBALY_BILL_POSTGREST_MODE: docker
          BUBALY_BILL_REST_URL: http://127.0.0.1:55491
        run: |
          set -euo pipefail
          [[ "$BUBALY_BILL_POSTGREST_GATE" == 1 && "$BUBALY_BILL_POSTGREST_MODE" == docker ]]
          node node_modules/vitest/vitest.mjs run tests/recurring-bill-postgrest.test.ts --reporter=verbose

      - name: Diagnose only this run's owned local services on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ -z "${DOCKER_HOST:-}" && -z "${DOCKER_CONTEXT:-}" ]]
          [[ "$(docker context show)" == default ]]
          [[ "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" == unix:///var/run/docker.sock ]]
          marker="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          prefix="bubaly-bill-rest-${marker}"
          docker version --format 'Local Docker server {{.Server.Version}}'
          # Never dump Config.Env, credentials, raw SQL data or request headers.
          for suffix in rest pg; do
            candidate="$prefix-$suffix"
            if [[ "$(docker inspect --type container --format '{{index .Config.Labels "bubaly.bill-postgrest-run"}}' "$candidate" 2>/dev/null)" == "$marker" ]]; then
              docker inspect --type container --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} network={{.HostConfig.NetworkMode}} ports={{json .NetworkSettings.Ports}}' "$candidate"
            fi
          done
          if [[ "$(docker network inspect --format '{{index .Labels "bubaly.bill-postgrest-run"}}' "$prefix-net" 2>/dev/null)" == "$marker" ]]; then
            docker network inspect --format 'Owned network driver={{.Driver}} internal={{.Internal}}' "$prefix-net"
          fi

      - name: Remove only this run's labelled containers, volumes and network
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ -z "${DOCKER_HOST:-}" && -z "${DOCKER_CONTEXT:-}" ]]
          [[ "$(docker context show)" == default ]]
          [[ "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" == unix:///var/run/docker.sock ]]
          marker="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          prefix="bubaly-bill-rest-${marker}"
          for suffix in rest pg; do
            candidate="$prefix-$suffix"
            if [[ "$(docker inspect --type container --format '{{index .Config.Labels "bubaly.bill-postgrest-run"}}' "$candidate" 2>/dev/null)" == "$marker" ]]; then
              docker rm --force --volumes "$candidate" > /dev/null
            fi
          done
          if [[ "$(docker network inspect --format '{{index .Labels "bubaly.bill-postgrest-run"}}' "$prefix-net" 2>/dev/null)" == "$marker" ]]; then
            docker network rm "$prefix-net" > /dev/null
          fi
