name: Member notes SQL runtime

# The held 0510 (supabase/reserved/) replaces the read on behavior_logs and
# care_log with one rule: a manager of the row's family, the note's author
# (behavior_logs.logged_by, care_log.created_by) or a caregiver, all inside
# is_family_member(family_id). The owner decided it this way ("managers,
# author, caregivers"). Before it, a teen or a child read every behaviour and
# care note written about every other member, and the ones written about them.
# Neither the Database job's replay nor `supabase db push` reads
# supabase/reserved/, and the Database job's probe glob does not read
# docs/audit/reserved/, so nothing else in CI exercises it. This job replays
# every runnable migration with the Database job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect, with no control failing, so a green step 3 is the
#      migration's and not a probe that can no longer see anything;
#   2. applies the held migration twice (it is re-runnable);
#   3. runs the probe again and requires it to pass;
#   4. re-runs the released probes over these two tables, each of which reads
#      which rule is installed where it must.
#
# When 0510 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/member-notes-runtime.yml'
      - 'supabase/reserved/0510_a_note_about_a_member_is_read_by_managers_its_author_and_caregivers.sql'
      - 'docs/audit/reserved/a-note-about-a-member-is-read-by-managers-its-author-and-caregivers-check.sql'
      - 'docs/audit/a-care-entry-names-who-logged-it-check.sql'
      - 'docs/audit/access-record-write-boundary-check.sql'
      - 'docs/audit/an-erasure-actually-erases-check.sql'
      - 'docs/audit/behavior-log-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/health-record-write-boundary-check.sql'
      - 'docs/audit/member-scope-crossing-check.sql'
      - 'docs/audit/plpgsql-bodies-resolve-check.sql'
      - 'docs/audit/rls-sweep-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/member-notes-runtime.yml'
      - 'supabase/reserved/0510_a_note_about_a_member_is_read_by_managers_its_author_and_caregivers.sql'
      - 'docs/audit/reserved/a-note-about-a-member-is-read-by-managers-its-author-and-caregivers-check.sql'
      - 'docs/audit/a-care-entry-names-who-logged-it-check.sql'
      - 'docs/audit/access-record-write-boundary-check.sql'
      - 'docs/audit/an-erasure-actually-erases-check.sql'
      - 'docs/audit/behavior-log-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/health-record-write-boundary-check.sql'
      - 'docs/audit/member-scope-crossing-check.sql'
      - 'docs/audit/plpgsql-bodies-resolve-check.sql'
      - 'docs/audit/rls-sweep-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: member-notes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  member-notes:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema lets a teen and a child read every note about another member
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-note-about-a-member-is-read-by-managers-its-author-and-caregivers-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect 0510 repairs'
            exit 1
          fi
          for expected in \
            "the teen reads notes they did not write in 2 of 2 tables" \
            "the child reads notes they did not write in 2 of 2 tables" \
            "the guest reads Note House notes in behavior_logs" \
            "the read is not 0510's on behavior_logs" \
            "| care_log (1 permissive read polic(ies): care_log_read USING is_family_member(family_id))"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed on the released schema, but not on: $expected"
              exit 1
            fi
          done
          if grep -qF 'CONTROL' <<<"$out"; then
            echo '::error::a control failed on the released schema, so the failure above is not only the defect'
            exit 1
          fi

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0510_a_note_about_a_member_is_read_by_managers_its_author_and_caregivers.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0510_a_note_about_a_member_is_read_by_managers_its_author_and_caregivers.sql

      - name: A note about a member is read by managers, its author and caregivers
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-note-about-a-member-is-read-by-managers-its-author-and-caregivers-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-note-about-a-member-is-read-by-managers-its-author-and-caregivers: OK' <<<"$out"

      - name: The released probes over these two tables still hold
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/a-care-entry-names-who-logged-it-check.sql \
            docs/audit/access-record-write-boundary-check.sql \
            docs/audit/an-erasure-actually-erases-check.sql \
            docs/audit/behavior-log-check.sql \
            docs/audit/gated-write-tables-check.sql \
            docs/audit/health-record-write-boundary-check.sql \
            docs/audit/member-scope-crossing-check.sql \
            docs/audit/plpgsql-bodies-resolve-check.sql \
            docs/audit/rls-sweep-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
