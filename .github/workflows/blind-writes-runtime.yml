name: Blind writes SQL runtime

# The held 0523 (supabase/reserved/) refuses a signed-in caller's UPDATE or
# DELETE of a row they cannot read, and an UPDATE that leaves one, on twelve
# tables whose read the held 0509, 0514, 0515, 0517 and 0520 narrow: an
# unfiltered PATCH or DELETE is checked against its own command's policies
# only, so a member who read none of the rows still rewrote or deleted them.
# Neither the Database job's replay nor `supabase db push` reads
# supabase/reserved/, and the Database job's probe glob does not read
# docs/audit/reserved/, so nothing else in CI exercises it. This job replays
# every runnable migration with the Database job's bootstrap, then:
#
#   1. applies the held read rules 0523 follows (0509, 0514, 0515, 0517,
#      0520): without them every member reads every row and there is no row a
#      member cannot read;
#   2. runs the held probe and requires it to FAIL on the defect alone (no
#      CONTROL or PRECONDITION line), so a green step 4 is the migration's and
#      not a probe that can no longer see anything;
#   3. applies 0523 twice (it is re-runnable);
#   4. runs the probe again and requires it to pass;
#   5. re-runs the held probes of those five read rules and the released
#      probes over these tables, each of which passes under both.
#
# When 0523 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/blind-writes-runtime.yml'
      - 'supabase/reserved/0523_a_member_changes_only_the_rows_they_can_read.sql'
      - 'docs/audit/reserved/a-member-changes-only-the-rows-they-can-read-check.sql'
      - 'supabase/reserved/0509_a_guest_does_not_read_the_households_most_sensitive_areas.sql'
      - 'supabase/reserved/0514_household_money_is_a_parents_or_adults.sql'
      - 'supabase/reserved/0515_a_childs_money_is_read_by_managers_and_that_child.sql'
      - 'supabase/reserved/0517_a_personal_record_is_read_by_managers_and_its_member.sql'
      - 'supabase/reserved/0520_a_guest_does_not_read_the_front_desks_call_history_or_the_hub.sql'
      - 'docs/audit/reserved/a-guest-does-not-read-the-households-most-sensitive-areas-check.sql'
      - 'docs/audit/reserved/household-money-is-a-parents-or-adults-check.sql'
      - 'docs/audit/reserved/a-childs-money-is-read-by-managers-and-that-child-check.sql'
      - 'docs/audit/reserved/a-personal-record-is-read-by-managers-and-its-member-check.sql'
      - 'docs/audit/reserved/a-guest-does-not-read-the-front-desks-call-history-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/document-vault-boundary-check.sql'
      - 'docs/audit/a-trip-links-a-document-once-check.sql'
      - 'docs/audit/driving-record-check.sql'
      - 'docs/audit/driving-score-write-boundary-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/blind-writes-runtime.yml'
      - 'supabase/reserved/0523_a_member_changes_only_the_rows_they_can_read.sql'
      - 'docs/audit/reserved/a-member-changes-only-the-rows-they-can-read-check.sql'
      - 'supabase/reserved/0509_a_guest_does_not_read_the_households_most_sensitive_areas.sql'
      - 'supabase/reserved/0514_household_money_is_a_parents_or_adults.sql'
      - 'supabase/reserved/0515_a_childs_money_is_read_by_managers_and_that_child.sql'
      - 'supabase/reserved/0517_a_personal_record_is_read_by_managers_and_its_member.sql'
      - 'supabase/reserved/0520_a_guest_does_not_read_the_front_desks_call_history_or_the_hub.sql'
      - 'docs/audit/reserved/a-guest-does-not-read-the-households-most-sensitive-areas-check.sql'
      - 'docs/audit/reserved/household-money-is-a-parents-or-adults-check.sql'
      - 'docs/audit/reserved/a-childs-money-is-read-by-managers-and-that-child-check.sql'
      - 'docs/audit/reserved/a-personal-record-is-read-by-managers-and-its-member-check.sql'
      - 'docs/audit/reserved/a-guest-does-not-read-the-front-desks-call-history-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/document-vault-boundary-check.sql'
      - 'docs/audit/a-trip-links-a-document-once-check.sql'
      - 'docs/audit/driving-record-check.sql'
      - 'docs/audit/driving-score-write-boundary-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: blind-writes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  blind-writes:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: Apply the held read rules 0523 follows
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0509_a_guest_does_not_read_the_households_most_sensitive_areas.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0514_household_money_is_a_parents_or_adults.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0515_a_childs_money_is_read_by_managers_and_that_child.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0517_a_personal_record_is_read_by_managers_and_its_member.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0520_a_guest_does_not_read_the_front_desks_call_history_or_the_hub.sql

      - name: With the read rules alone a member rewrites and deletes rows they cannot read
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-member-changes-only-the-rows-they-can-read-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed with the read rules alone, so it can no longer see the defect'
            exit 1
          fi
          if grep -qE 'CONTROL|PRECONDITION' <<<"$out"; then
            echo '::error::a control or precondition failed with the read rules alone, not only the defect'
            exit 1
          fi
          for expected in \
            "the child, who reads no row of home_warranties, deleted them blind (OK 1)" \
            "the child, who reads no row of wallet_cards, rewrote them blind (OK 1)" \
            "the guest, who reads no row of utility_bills, deleted them blind (OK 1)" \
            "the teen's unfiltered update handed their own wallet card to the child, a row they then cannot read (OK 1)" \
            "0523's guard is not in place on home_warranties"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed, but not on: $expected"
              exit 1
            fi
          done

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0523_a_member_changes_only_the_rows_they_can_read.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0523_a_member_changes_only_the_rows_they_can_read.sql

      - name: A member changes only the rows they can read
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-member-changes-only-the-rows-they-can-read-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-member-changes-only-the-rows-they-can-read: OK' <<<"$out"

      - name: The read rules' probes and the released probes over these tables still hold
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/reserved/a-guest-does-not-read-the-households-most-sensitive-areas-check.sql \
            docs/audit/reserved/household-money-is-a-parents-or-adults-check.sql \
            docs/audit/reserved/a-childs-money-is-read-by-managers-and-that-child-check.sql \
            docs/audit/reserved/a-personal-record-is-read-by-managers-and-its-member-check.sql \
            docs/audit/reserved/a-guest-does-not-read-the-front-desks-call-history-check.sql \
            docs/audit/gated-write-tables-check.sql \
            docs/audit/document-vault-boundary-check.sql \
            docs/audit/a-trip-links-a-document-once-check.sql \
            docs/audit/driving-record-check.sql \
            docs/audit/driving-score-write-boundary-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
