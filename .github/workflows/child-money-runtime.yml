name: Child money SQL runtime

# The held 0515 (supabase/reserved/) replaces the read on sixteen tables of a
# child's money, inside is_family_member(family_id): a manager of the row's
# family or the member it is for (child_wallets, wallet_cards, wallet_passes,
# wallet_rewards, stripe_cardholders), or a manager or the child whose wallet
# it is on (stripe_issuing_cards, stripe_authorizations, wallet_transactions,
# invest_holdings, invest_orders, pay_handles, wallet_buckets, wallet_goals,
# wallet_rules, allowance_rules, gift_links), through a SECURITY DEFINER
# helper pinned to the row's family. The owner decided it this way. Before it,
# a sibling, a caregiver or a guest read every child's balance, ledger, goals,
# allowance, cards, investments, gift links and Pay-IDs.
# Neither the Database job's replay nor `supabase db push` reads
# supabase/reserved/, and the Database job's probe glob does not read
# docs/audit/reserved/, so nothing else in CI exercises it. This job replays
# every runnable migration with the Database job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect, with no control failing, so a green step 3 is the
#      migration's and not a probe that can no longer see anything;
#   2. applies the held migration twice (it is re-runnable);
#   3. runs the probe again and requires it to pass;
#   4. re-runs the released probes over these tables, and then the held probe
#      once more: wallet-write-rls-check re-runs 0275, which re-creates the
#      family-wide reads on five wallet tables, and must leave them as it
#      found them.
#
# When 0515 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/child-money-runtime.yml'
      - 'supabase/reserved/0515_a_childs_money_is_read_by_managers_and_that_child.sql'
      - 'docs/audit/reserved/a-childs-money-is-read-by-managers-and-that-child-check.sql'
      - 'docs/audit/a-child-cannot-spend-the-same-dollar-twice-check.sql'
      - 'docs/audit/a-live-hold-counts-and-an-order-names-both-families-check.sql'
      - 'docs/audit/a-request-says-who-actually-filed-it-check.sql'
      - 'docs/audit/allowance-rule-write-boundary-check.sql'
      - 'docs/audit/audit-log-says-who-wrote-it-check.sql'
      - 'docs/audit/blanket-policy-check.sql'
      - 'docs/audit/chore-paid-once-check.sql'
      - 'docs/audit/cross-family-reference-check.sql'
      - 'docs/audit/economy-invest-decision-check.sql'
      - 'docs/audit/every-role-through-the-manager-rpcs-check.sql'
      - 'docs/audit/family-scoped-index-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/gift-money-route-check.sql'
      - 'docs/audit/invest-order-fill-check.sql'
      - 'docs/audit/meal-plan-grocery-boundary-check.sql'
      - 'docs/audit/money-decision-rows-check.sql'
      - 'docs/audit/money-instruction-write-check.sql'
      - 'docs/audit/pay-id-and-goal-write-check.sql'
      - 'docs/audit/playbook-suggestions-cannot-smuggle-a-sensitive-fact-check.sql'
      - 'docs/audit/plpgsql-bodies-resolve-check.sql'
      - 'docs/audit/reward-catalogue-price-check.sql'
      - 'docs/audit/reward-redemption-decision-check.sql'
      - 'docs/audit/rls-isolation-check.sql'
      - 'docs/audit/rls-sweep-check.sql'
      - 'docs/audit/wallet-audit-actor-check.sql'
      - 'docs/audit/wallet-concurrency-check.sql'
      - 'docs/audit/wallet-goal-manager-write-check.sql'
      - 'docs/audit/wallet-overspend-check.sql'
      - 'docs/audit/wallet-side-table-write-check.sql'
      - 'docs/audit/wallet-write-rls-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/child-money-runtime.yml'
      - 'supabase/reserved/0515_a_childs_money_is_read_by_managers_and_that_child.sql'
      - 'docs/audit/reserved/a-childs-money-is-read-by-managers-and-that-child-check.sql'
      - 'docs/audit/a-child-cannot-spend-the-same-dollar-twice-check.sql'
      - 'docs/audit/a-live-hold-counts-and-an-order-names-both-families-check.sql'
      - 'docs/audit/a-request-says-who-actually-filed-it-check.sql'
      - 'docs/audit/allowance-rule-write-boundary-check.sql'
      - 'docs/audit/audit-log-says-who-wrote-it-check.sql'
      - 'docs/audit/blanket-policy-check.sql'
      - 'docs/audit/chore-paid-once-check.sql'
      - 'docs/audit/cross-family-reference-check.sql'
      - 'docs/audit/economy-invest-decision-check.sql'
      - 'docs/audit/every-role-through-the-manager-rpcs-check.sql'
      - 'docs/audit/family-scoped-index-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/gift-money-route-check.sql'
      - 'docs/audit/invest-order-fill-check.sql'
      - 'docs/audit/meal-plan-grocery-boundary-check.sql'
      - 'docs/audit/money-decision-rows-check.sql'
      - 'docs/audit/money-instruction-write-check.sql'
      - 'docs/audit/pay-id-and-goal-write-check.sql'
      - 'docs/audit/playbook-suggestions-cannot-smuggle-a-sensitive-fact-check.sql'
      - 'docs/audit/plpgsql-bodies-resolve-check.sql'
      - 'docs/audit/reward-catalogue-price-check.sql'
      - 'docs/audit/reward-redemption-decision-check.sql'
      - 'docs/audit/rls-isolation-check.sql'
      - 'docs/audit/rls-sweep-check.sql'
      - 'docs/audit/wallet-audit-actor-check.sql'
      - 'docs/audit/wallet-concurrency-check.sql'
      - 'docs/audit/wallet-goal-manager-write-check.sql'
      - 'docs/audit/wallet-overspend-check.sql'
      - 'docs/audit/wallet-side-table-write-check.sql'
      - 'docs/audit/wallet-write-rls-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: child-money-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  child-money:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema lets every member read every child's money
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-childs-money-is-read-by-managers-and-that-child-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect 0515 repairs'
            exit 1
          fi
          for expected in \
            "the teen reads other members' money in 16 of 16 tables" \
            "the child reads other members' money in 16 of 16 tables" \
            "the caregiver reads other members' money in 16 of 16 tables" \
            "the guest reads other members' money in 16 of 16 tables" \
            "the read is not 0515's on child_wallets"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed on the released schema, but not on: $expected"
              exit 1
            fi
          done
          if grep -qF 'CONTROL' <<<"$out"; then
            echo '::error::a control failed on the released schema, so the failure above is not only the defect'
            exit 1
          fi

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0515_a_childs_money_is_read_by_managers_and_that_child.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0515_a_childs_money_is_read_by_managers_and_that_child.sql

      - name: A child's money is read by managers and that child
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-childs-money-is-read-by-managers-and-that-child-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-childs-money-is-read-by-managers-and-that-child: OK' <<<"$out"

      - name: The released probes over these tables still hold, and leave 0515 in place
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/a-child-cannot-spend-the-same-dollar-twice-check.sql \
            docs/audit/a-live-hold-counts-and-an-order-names-both-families-check.sql \
            docs/audit/a-request-says-who-actually-filed-it-check.sql \
            docs/audit/allowance-rule-write-boundary-check.sql \
            docs/audit/audit-log-says-who-wrote-it-check.sql \
            docs/audit/blanket-policy-check.sql \
            docs/audit/chore-paid-once-check.sql \
            docs/audit/cross-family-reference-check.sql \
            docs/audit/economy-invest-decision-check.sql \
            docs/audit/every-role-through-the-manager-rpcs-check.sql \
            docs/audit/family-scoped-index-check.sql \
            docs/audit/gated-write-tables-check.sql \
            docs/audit/gift-money-route-check.sql \
            docs/audit/invest-order-fill-check.sql \
            docs/audit/meal-plan-grocery-boundary-check.sql \
            docs/audit/money-decision-rows-check.sql \
            docs/audit/money-instruction-write-check.sql \
            docs/audit/pay-id-and-goal-write-check.sql \
            docs/audit/playbook-suggestions-cannot-smuggle-a-sensitive-fact-check.sql \
            docs/audit/plpgsql-bodies-resolve-check.sql \
            docs/audit/reward-catalogue-price-check.sql \
            docs/audit/reward-redemption-decision-check.sql \
            docs/audit/rls-isolation-check.sql \
            docs/audit/rls-sweep-check.sql \
            docs/audit/wallet-audit-actor-check.sql \
            docs/audit/wallet-concurrency-check.sql \
            docs/audit/wallet-goal-manager-write-check.sql \
            docs/audit/wallet-overspend-check.sql \
            docs/audit/wallet-side-table-write-check.sql \
            docs/audit/wallet-write-rls-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-childs-money-is-read-by-managers-and-that-child-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-childs-money-is-read-by-managers-and-that-child: OK' <<<"$out"
