name: Call history writes SQL runtime

# The held 0521 (supabase/reserved/) makes the AI Front Desk's call history
# (call_logs) read-only to the household, as the application already treats
# it: it drops 0092's member insert and update policies and revokes the client
# roles' INSERT and UPDATE, keeping the members' read and the managers' delete.
# Neither the Database job's replay nor `supabase db push` reads
# supabase/reserved/, and the Database job's probe glob does not read
# docs/audit/reserved/, so nothing else in CI exercises it. This job replays
# every runnable migration with the Database job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect alone (no CONTROL line), so a green step 3 is the migration's
#      and not a probe that can no longer see anything;
#   2. applies the held migration twice (it is re-runnable);
#   3. runs the probe again and requires it to pass;
#   4. re-runs the released probes that inventory call_logs' writes, each of
#      which passes under both.
#
# When 0521 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/call-history-writes-runtime.yml'
      - 'supabase/reserved/0521_a_call_in_the_front_desk_history_is_written_by_no_member.sql'
      - 'docs/audit/reserved/a-call-in-the-front-desk-history-is-written-by-no-member-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/realtime-anon-stream-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/call-history-writes-runtime.yml'
      - 'supabase/reserved/0521_a_call_in_the_front_desk_history_is_written_by_no_member.sql'
      - 'docs/audit/reserved/a-call-in-the-front-desk-history-is-written-by-no-member-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/realtime-anon-stream-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: call-history-writes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call-history-writes:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema lets a member write the call history
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-call-in-the-front-desk-history-is-written-by-no-member-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect 0521 repairs'
            exit 1
          fi
          if grep -qF 'CONTROL' <<<"$out"; then
            echo '::error::a control failed on the released schema, not only the defect 0521 repairs'
            exit 1
          fi
          for expected in \
            "the child added a call to the household's history (OK 1)" \
            "the guest rewrote the voicemail's transcript (OK 1)" \
            "the voicemail's transcript no longer reads as the call was filed" \
            "call_logs' writes are not 0521's: a permissive insert or update policy for a client role is there | a client role holds INSERT or UPDATE"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed, but not on: $expected"
              exit 1
            fi
          done

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0521_a_call_in_the_front_desk_history_is_written_by_no_member.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0521_a_call_in_the_front_desk_history_is_written_by_no_member.sql

      - name: A call in the front desk's history is written by no member
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-call-in-the-front-desk-history-is-written-by-no-member-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-call-in-the-front-desk-history-is-written-by-no-member: OK' <<<"$out"

      - name: The released probes over call_logs still hold
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/gated-write-tables-check.sql \
            docs/audit/realtime-anon-stream-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
