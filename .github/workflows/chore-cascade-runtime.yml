name: Chore cascade SQL runtime

# The held 0502 (supabase/reserved/) adds a BEFORE DELETE OR UPDATE OF
# family_id guard on chores: a signed-in non-manager deletes a chore only while
# it has no assignments, and does not move one to another family at all. 0374
# made deleting an assignment a manager's only, but chores stayed deletable by
# any member and chore_assignments.chore_id cascades, which RLS does not gate,
# so a child erased a sibling's approved points by deleting the chore, or by
# moving it to a family where they are a parent and deleting it there. Neither
# the Database job's replay nor `supabase db push` reads supabase/reserved/, and
# the Database job's probe glob does not read docs/audit/reserved/, so nothing
# else in CI exercises it. This job replays every runnable migration with the
# Database job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect, so a green step 3 is the migration's and not a probe that
#      can no longer see anything;
#   2. runs the two-session race probe there and requires it to FAIL on the
#      insert-first and move-first timings (owner review 6097190516);
#   3. applies the held migration twice (it is re-runnable);
#   4. runs both probes again and requires them to pass; the race probe's own
#      negative control there swaps in the second cut's "refuse only if an
#      assignment is visible" move rule and requires the race to reproduce;
#   5. re-runs the released chore probes over the added trigger.
#
# When 0502 is released into supabase/migrations/, its probes move back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/chore-cascade-runtime.yml'
      - 'supabase/reserved/0502_a_chore_with_assignments_is_a_managers_to_remove.sql'
      - 'docs/audit/reserved/a-chore-with-assignments-is-a-managers-to-remove-check.sql'
      - 'docs/audit/reserved/a-chore-move-cannot-race-an-assignment-check.sql'
      - 'docs/audit/chore-price-check.sql'
      - 'docs/audit/chore-assignment-owner-check.sql'
      - 'docs/audit/chore-assignment-delete-is-a-managers-check.sql'
      - 'docs/audit/chore-award-amount-check.sql'
      - 'docs/audit/reward-balance-check.sql'
      - 'docs/audit/cross-family-reference-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/chore-cascade-runtime.yml'
      - 'supabase/reserved/0502_a_chore_with_assignments_is_a_managers_to_remove.sql'
      - 'docs/audit/reserved/a-chore-with-assignments-is-a-managers-to-remove-check.sql'
      - 'docs/audit/reserved/a-chore-move-cannot-race-an-assignment-check.sql'
      - 'docs/audit/chore-price-check.sql'
      - 'docs/audit/chore-assignment-owner-check.sql'
      - 'docs/audit/chore-assignment-delete-is-a-managers-check.sql'
      - 'docs/audit/chore-award-amount-check.sql'
      - 'docs/audit/reward-balance-check.sql'
      - 'docs/audit/cross-family-reference-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: chore-cascade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chore-cascade:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema still lets a chore delete clear its assignments
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-chore-with-assignments-is-a-managers-to-remove-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect 0502 repairs'
            exit 1
          fi
          for expected in \
            "a child deleted the chore holding a sibling's approved 50-point assignment" \
            "a child deleted the chore holding their own open assignment"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed on the released schema, but not on: $expected"
              exit 1
            fi
          done

      - name: The released schema lets a chore move race an assignment insert
        shell: bash
        run: |
          set -euo pipefail
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-chore-move-cannot-race-an-assignment-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the race probe passed on the released schema, so it can no longer see the defect 0502 repairs'
            exit 1
          fi
          for expected in \
            "real A (insert first): the child moved the chore while the assignment insert was open (UPDATE 1), then deleted it there (DELETE 1); the sibling's approved assignment left: 0" \
            "real B (move first): the child's move landed (UPDATE 1), the assignment insert beside it INSERT 0 1, and after the child deleted the chore there the sibling's approved assignment left: 0"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the race probe failed on the released schema, but not on: $expected"
              exit 1
            fi
          done

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0502_a_chore_with_assignments_is_a_managers_to_remove.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0502_a_chore_with_assignments_is_a_managers_to_remove.sql

      - name: A chore with assignments is a manager's to remove
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-chore-with-assignments-is-a-managers-to-remove-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-chore-with-assignments-is-a-managers-to-remove: OK' <<<"$out"

      - name: A chore move cannot race an assignment (two sessions)
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-chore-move-cannot-race-an-assignment-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-chore-move-cannot-race-an-assignment: OK' <<<"$out"

      - name: The released chore probes still hold over the added trigger
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/chore-price-check.sql \
            docs/audit/chore-assignment-owner-check.sql \
            docs/audit/chore-assignment-delete-is-a-managers-check.sql \
            docs/audit/chore-award-amount-check.sql \
            docs/audit/reward-balance-check.sql \
            docs/audit/cross-family-reference-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
