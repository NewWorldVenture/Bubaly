name: Kid household SQL runtime

# The held 0507 (supabase/reserved/) makes 0482's is_child_login_account() also
# read the kid-login mark the server writes (app_metadata.bubaly_kid_login), as
# 0495's accept_invite does. 0482's families_insert asks that function, so a kid
# login whose address moved off the synthetic domain (and has no mapping) can no
# longer start a household it would be the parent of, invite a stranger into
# it, and be reached there where its own parents cannot see. Neither the Database job's replay nor
# `supabase db push` reads supabase/reserved/, and the Database job's probe glob
# does not read docs/audit/reserved/, so nothing else in CI exercises it. This
# job replays every runnable migration with the Database job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect, so a green step 3 is the migration's and not a probe that
#      can no longer see anything;
#   2. applies the held migration twice (it is re-runnable);
#   3. runs the probe again and requires it to pass;
#   4. re-runs the released probes that create families or drive invitations.
#
# When 0507 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/kid-household-runtime.yml'
      - 'supabase/reserved/0507_a_kid_login_does_not_start_a_household.sql'
      - 'docs/audit/reserved/a-kid-login-does-not-start-a-household-check.sql'
      - 'docs/audit/invite-role-escalation-check.sql'
      - 'docs/audit/invite-cannot-rewrite-what-it-grants-check.sql'
      - 'docs/audit/two-parents-means-two-parents-check.sql'
      - 'docs/audit/rls-isolation-check.sql'
      - 'docs/audit/entitlement-write-boundary-check.sql'
      - 'docs/audit/family-delete-cascade-check.sql'
      - 'docs/audit/child-login-mapping-is-managers-only-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kid-household-runtime.yml'
      - 'supabase/reserved/0507_a_kid_login_does_not_start_a_household.sql'
      - 'docs/audit/reserved/a-kid-login-does-not-start-a-household-check.sql'
      - 'docs/audit/invite-role-escalation-check.sql'
      - 'docs/audit/invite-cannot-rewrite-what-it-grants-check.sql'
      - 'docs/audit/two-parents-means-two-parents-check.sql'
      - 'docs/audit/rls-isolation-check.sql'
      - 'docs/audit/entitlement-write-boundary-check.sql'
      - 'docs/audit/family-delete-cascade-check.sql'
      - 'docs/audit/child-login-mapping-is-managers-only-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: kid-household-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kid-household:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema lets a kid login start a household
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-kid-login-does-not-start-a-household-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect 0507 repairs'
            exit 1
          fi
          for expected in \
            'a kid login known by its app_metadata mark started a household of its own (OK 1)' \
            'a kid login known by its app_metadata mark belongs to 1 household(s) besides its own family' \
            'is_child_login_account() does not read the kid-login mark the server writes'; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed on the released schema, but not on: $expected"
              exit 1
            fi
          done
          if grep -qF 'CONTROL' <<<"$out"; then
            echo '::error::a control failed on the released schema, so the failure above is not only the defect'
            exit 1
          fi

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0507_a_kid_login_does_not_start_a_household.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0507_a_kid_login_does_not_start_a_household.sql

      - name: A kid login does not start a household
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-kid-login-does-not-start-a-household-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-kid-login-does-not-start-a-household: OK' <<<"$out"

      - name: The released probes over family creation and invitations still hold
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/invite-role-escalation-check.sql \
            docs/audit/invite-cannot-rewrite-what-it-grants-check.sql \
            docs/audit/two-parents-means-two-parents-check.sql \
            docs/audit/rls-isolation-check.sql \
            docs/audit/entitlement-write-boundary-check.sql \
            docs/audit/family-delete-cascade-check.sql \
            docs/audit/child-login-mapping-is-managers-only-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
