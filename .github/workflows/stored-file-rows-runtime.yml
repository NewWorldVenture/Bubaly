name: Stored file rows SQL runtime

# The held 0499 (supabase/reserved/) makes a write to the `documents` storage
# bucket follow the row of the object's own family that names the file: an
# insurance card image (insurance_policies, managers only) is no longer
# replaced, moved or removed by a child, teen, caregiver or guest; a guest no
# longer writes the bytes behind a household document (0464's rule); nobody
# without the right uploads at a sensitive document's path; and a row planted
# by another family no longer hides a family's file from it. Neither the
# Database job's replay nor `supabase db push` reads supabase/reserved/, and
# the Database job's probe glob does not read docs/audit/reserved/, so nothing
# else in CI exercises it. This job replays every runnable migration with the
# Database job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect, so a green step 3 is the migration's and not a probe that
#      can no longer see anything;
#   2. applies the held migration twice (it is re-runnable);
#   3. runs the probe again and requires it to pass;
#   4. re-runs the released probes of the same bucket, because 0499 re-creates
#      0007's and 0303's policies under their own names.
#
# When 0499 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/stored-file-rows-runtime.yml'
      - 'supabase/reserved/0499_a_stored_file_answers_to_its_own_familys_rows.sql'
      - 'docs/audit/reserved/a-stored-file-answers-to-its-own-familys-rows-check.sql'
      - 'docs/audit/document-bytes-boundary-check.sql'
      - 'docs/audit/document-vault-boundary-check.sql'
      - 'docs/audit/document-category-classifier-check.sql'
      - 'docs/audit/bucket-visibility-is-declared-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stored-file-rows-runtime.yml'
      - 'supabase/reserved/0499_a_stored_file_answers_to_its_own_familys_rows.sql'
      - 'docs/audit/reserved/a-stored-file-answers-to-its-own-familys-rows-check.sql'
      - 'docs/audit/document-bytes-boundary-check.sql'
      - 'docs/audit/document-vault-boundary-check.sql'
      - 'docs/audit/document-category-classifier-check.sql'
      - 'docs/audit/bucket-visibility-is-declared-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: stored-file-rows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stored-file-rows:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema still lets a file outrun its row
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-stored-file-answers-to-its-own-familys-rows-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect 0499 repairs'
            exit 1
          fi
          for expected in \
            'a child changed or reached the front of the insurance card a parent saved' \
            'a guest changed or reached the bytes behind a household document' \
            "a child changed or reached a sensitive document's file" \
            "another family's rows stopped a parent of the family using its own file"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed on the released schema, but not on: $expected"
              exit 1
            fi
          done

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0499_a_stored_file_answers_to_its_own_familys_rows.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0499_a_stored_file_answers_to_its_own_familys_rows.sql

      - name: A stored file answers to its own family's rows
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-stored-file-answers-to-its-own-familys-rows-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-stored-file-answers-to-its-own-familys-rows: OK' <<<"$out"

      - name: The bucket's released probes still hold over the re-created policies
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/document-bytes-boundary-check.sql \
            docs/audit/document-vault-boundary-check.sql \
            docs/audit/document-category-classifier-check.sql \
            docs/audit/bucket-visibility-is-declared-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
