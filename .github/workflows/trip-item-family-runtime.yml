name: Trip item family SQL runtime

# The held 0503 (supabase/reserved/) adds a move guard to trip_items (a family
# change needs a manager of BOTH families) and binds trip_id to the item's own
# family with 0311's reference_shares_family. trip_item_content_guard asks only
# whether the caller manages the NEW family, and the update policy is
# is_family_member(family_id) on both halves, so a teen of one family who is a
# parent of another moved the first family's packing items into their own: a
# delete, and a rewrite, they could not do directly. Neither the Database job's
# replay nor `supabase db push` reads supabase/reserved/, and the Database
# job's probe glob does not read docs/audit/reserved/, so nothing else in CI
# exercises it. This job replays every runnable migration with the Database
# job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect, so a green step 3 is the migration's and not a probe that
#      can no longer see anything;
#   2. applies the held migration twice (it is re-runnable);
#   3. runs the probe again and requires it to pass;
#   4. re-runs the released probes that inventory trip_items and 0311's
#      references.
#
# When 0503 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/trip-item-family-runtime.yml'
      - 'supabase/reserved/0503_a_trip_item_stays_with_its_trips_family.sql'
      - 'docs/audit/reserved/a-trip-item-stays-with-its-trips-family-check.sql'
      - 'docs/audit/cross-family-reference-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/ui-only-manager-gate-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/trip-item-family-runtime.yml'
      - 'supabase/reserved/0503_a_trip_item_stays_with_its_trips_family.sql'
      - 'docs/audit/reserved/a-trip-item-stays-with-its-trips-family-check.sql'
      - 'docs/audit/cross-family-reference-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/ui-only-manager-gate-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: trip-item-family-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trip-item-family:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema still lets a trip item leave its family
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-trip-item-stays-with-its-trips-family-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect 0503 repairs'
            exit 1
          fi
          for expected in \
            "a teen of Trip House moved a packing item (relabelled) into the family where they are a parent (OK 1)" \
            "a teen of Trip House moved a packing item (family only) into the family where they are a parent (OK 1)" \
            "a teen of Trip House moved a packing item (with a trip of their own house) into the family where they are a parent (OK 1)" \
            "a manager of both families moved an item into the other family still naming Trip House's trip (OK 1)" \
            "a manager filed a Trip House item against another family's trip (OK 1)"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed on the released schema, but not on: $expected"
              exit 1
            fi
          done

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0503_a_trip_item_stays_with_its_trips_family.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0503_a_trip_item_stays_with_its_trips_family.sql

      - name: A trip item stays with its trip's family
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-trip-item-stays-with-its-trips-family-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-trip-item-stays-with-its-trips-family: OK' <<<"$out"

      - name: The released probes over trip_items and 0311's references still hold
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/cross-family-reference-check.sql \
            docs/audit/gated-write-tables-check.sql \
            docs/audit/ui-only-manager-gate-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
