name: Marketplace order finish SQL runtime

# The held 0518 (supabase/reserved/) adds a BEFORE UPDATE guard on
# marketplace_orders: a client's change of `status` to `returned` or
# `completed`, or of `returned_at`, is refused unless the caller is the order's
# seller_member, as setOrderStatusAction already decides. The update policy lets
# either party write the row, so a borrower could mark a borrowed item returned
# (ending its overdue reminders) and a buyer could complete a sale never handed
# over, each with one PostgREST PATCH. Neither the Database job's replay nor
# `supabase db push` reads supabase/reserved/, and the Database job's probe glob
# does not read docs/audit/reserved/, so nothing else in CI exercises it. This
# job replays every runnable migration with the Database job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect, so a green step 3 is the migration's and not a probe that
#      can no longer see anything;
#   2. applies the held migration twice (it is re-runnable);
#   3. runs the probe again and requires it to pass;
#   4. re-runs the released probes that write marketplace orders.
#
# When 0518 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/marketplace-order-finish-runtime.yml'
      - 'supabase/reserved/0518_a_marketplace_order_is_returned_or_completed_by_its_seller.sql'
      - 'docs/audit/reserved/a-marketplace-order-is-returned-or-completed-by-its-seller-check.sql'
      - 'docs/audit/a-live-hold-counts-and-an-order-names-both-families-check.sql'
      - 'docs/audit/marketplace-deal-terms-check.sql'
      - 'docs/audit/marketplace-handoff-check.sql'
      - 'docs/audit/marketplace-ownership-update-check.sql'
      - 'docs/audit/marketplace-review-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/marketplace-order-finish-runtime.yml'
      - 'supabase/reserved/0518_a_marketplace_order_is_returned_or_completed_by_its_seller.sql'
      - 'docs/audit/reserved/a-marketplace-order-is-returned-or-completed-by-its-seller-check.sql'
      - 'docs/audit/a-live-hold-counts-and-an-order-names-both-families-check.sql'
      - 'docs/audit/marketplace-deal-terms-check.sql'
      - 'docs/audit/marketplace-handoff-check.sql'
      - 'docs/audit/marketplace-ownership-update-check.sql'
      - 'docs/audit/marketplace-review-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: marketplace-order-finish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  marketplace-order-finish:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema still lets a buyer finish an order themselves
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-marketplace-order-is-returned-or-completed-by-its-seller-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect 0518 repairs'
            exit 1
          fi
          for expected in \
            "the buyer marked their active borrow returned (OK 1)" \
            "the buyer marked their active sale completed (OK 1)" \
            "the buyer marked their returned borrow completed (OK 1)" \
            "the buyer stamped their active borrow returned_at (OK 1)" \
            "the buyer marked their active borrow with no seller left returned (OK 1)" \
            "the in-family buyer marked their active sale completed (OK 1)"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed on the released schema, but not on: $expected"
              exit 1
            fi
          done

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0518_a_marketplace_order_is_returned_or_completed_by_its_seller.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0518_a_marketplace_order_is_returned_or_completed_by_its_seller.sql

      - name: A marketplace order is returned or completed by its seller
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-marketplace-order-is-returned-or-completed-by-its-seller-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-marketplace-order-is-returned-or-completed-by-its-seller: OK' <<<"$out"

      - name: The released probes that write marketplace orders still hold
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/a-live-hold-counts-and-an-order-names-both-families-check.sql \
            docs/audit/marketplace-deal-terms-check.sql \
            docs/audit/marketplace-handoff-check.sql \
            docs/audit/marketplace-ownership-update-check.sql \
            docs/audit/marketplace-review-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
