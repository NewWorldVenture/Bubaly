name: Library curation SQL runtime

# The held 0526 (supabase/reserved/) puts the family library's rule on its
# tables: only a parent or another adult adds a subscription or an audio
# address, or changes either, and created_by names the writer. A BEFORE INSERT
# OR UPDATE guard on library_feeds and library_items refuses a signed-in
# caller's write otherwise; 0284's policies let any member write any row.
# Neither the Database job's replay nor `supabase db push` reads
# supabase/reserved/, and the Database job's probe glob does not read
# docs/audit/reserved/, so nothing else in CI exercises it. This job replays
# every runnable migration with the Database job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect alone (no CONTROL line), so a green step 3 is the migration's
#      and not a probe that can no longer see anything;
#   2. applies the held migration twice (it is re-runnable);
#   3. runs the probe again and requires it to pass;
#   4. re-runs the released probes over these tables, their triggers and the
#      deletes that cascade into them, each of which passes under both.
#
# When 0526 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/library-curation-runtime.yml'
      - 'supabase/reserved/0526_what_the_library_streams_is_added_by_a_parent_or_adult.sql'
      - 'docs/audit/reserved/what-the-library-streams-is-added-by-a-parent-or-adult-check.sql'
      - 'docs/audit/an-erasure-actually-erases-check.sql'
      - 'docs/audit/definer-functions-check-their-caller-check.sql'
      - 'docs/audit/family-delete-cascade-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/plpgsql-bodies-resolve-check.sql'
      - 'docs/audit/rls-sweep-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/library-curation-runtime.yml'
      - 'supabase/reserved/0526_what_the_library_streams_is_added_by_a_parent_or_adult.sql'
      - 'docs/audit/reserved/what-the-library-streams-is-added-by-a-parent-or-adult-check.sql'
      - 'docs/audit/an-erasure-actually-erases-check.sql'
      - 'docs/audit/definer-functions-check-their-caller-check.sql'
      - 'docs/audit/family-delete-cascade-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/plpgsql-bodies-resolve-check.sql'
      - 'docs/audit/rls-sweep-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: library-curation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  library-curation:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema lets a child add and retarget what the library streams
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/what-the-library-streams-is-added-by-a-parent-or-adult-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect'
            exit 1
          fi
          if grep -qE 'CONTROL|PRECONDITION' <<<"$out"; then
            echo '::error::a control or precondition failed on the released schema, not only the defect'
            exit 1
          fi
          for expected in \
            "the child added a subscription (OK 1)" \
            "the child retargeted the parent's subscription (OK 1)" \
            "the child added a book with an audio address (OK 1)" \
            "the child filed an episode under the parent's subscription (OK 1)" \
            "the child rewrote the audio address of the parent's audiobook (OK 1)" \
            "the teen rewrote the audio address of the parent's audiobook (OK 1)" \
            "the child emptied who added the subscription the child planted (OK 1)" \
            "0526's guard is not in place on library_feeds, library_items"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed, but not on: $expected"
              exit 1
            fi
          done

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0526_what_the_library_streams_is_added_by_a_parent_or_adult.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0526_what_the_library_streams_is_added_by_a_parent_or_adult.sql

      - name: What the library streams is added by a parent or adult
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/what-the-library-streams-is-added-by-a-parent-or-adult-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'what-the-library-streams-is-added-by-a-parent-or-adult: OK' <<<"$out"

      - name: The released probes over the library tables still hold
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/an-erasure-actually-erases-check.sql \
            docs/audit/definer-functions-check-their-caller-check.sql \
            docs/audit/family-delete-cascade-check.sql \
            docs/audit/gated-write-tables-check.sql \
            docs/audit/plpgsql-bodies-resolve-check.sql \
            docs/audit/rls-sweep-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
