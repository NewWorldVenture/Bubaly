name: Closed vote SQL runtime

# The held 0525 (supabase/reserved/) refuses a ballot cast or changed on a meal
# vote or family poll that is not open: a BEFORE INSERT OR UPDATE guard on
# meal_vote_ballots and family_poll_votes reads the vote in the row's family
# FOR SHARE (so a close in flight is waited for). The ballot tables checked who
# votes but never whether the vote was still open. Neither the Database job's
# replay nor `supabase db push` reads supabase/reserved/, and the Database
# job's probe glob does not read docs/audit/reserved/, so nothing else in CI
# exercises it. This job replays every runnable migration with the Database
# job's bootstrap, then:
#
#   1. runs the held probe on that released schema and requires it to FAIL on
#      the defect alone (no CONTROL line), so a green step 3 is the migration's
#      and not a probe that can no longer see anything;
#   2. applies the held migration twice (it is re-runnable);
#   3. runs the probe again and requires it to pass;
#   4. re-runs the released probes over these tables, each of which passes
#      under both.
#
# When 0525 is released into supabase/migrations/, its probe moves back to
# docs/audit/ (the Database job then runs it) and this workflow is retired with
# it. Throwaway database only; agents must not apply migrations to production.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/closed-vote-runtime.yml'
      - 'supabase/reserved/0525_a_closed_vote_takes_no_more_ballots.sql'
      - 'docs/audit/reserved/a-closed-vote-takes-no-more-ballots-check.sql'
      - 'docs/audit/family-scoped-index-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/meal-ballot-is-per-option-check.sql'
      - 'docs/audit/poll-single-choice-check.sql'
      - 'docs/audit/rls-sweep-check.sql'
      - 'docs/audit/vote-owner-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/closed-vote-runtime.yml'
      - 'supabase/reserved/0525_a_closed_vote_takes_no_more_ballots.sql'
      - 'docs/audit/reserved/a-closed-vote-takes-no-more-ballots-check.sql'
      - 'docs/audit/family-scoped-index-check.sql'
      - 'docs/audit/gated-write-tables-check.sql'
      - 'docs/audit/meal-ballot-is-per-option-check.sql'
      - 'docs/audit/poll-single-choice-check.sql'
      - 'docs/audit/rls-sweep-check.sql'
      - 'docs/audit/vote-owner-check.sql'
      - 'docs/audit/pg-bootstrap.sh'
      - 'supabase/SEED_ALL.sql'
      - 'supabase/migrations/**'

permissions:
  contents: read

concurrency:
  group: closed-vote-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  closed-vote:
    if: >-
      github.repository == 'NewWorldVenture/Bubaly' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No service container, for the reason invite-rejoin-role-runtime.yml gives:
    # Docker Hub's unauthenticated pull limit refuses pgvector/pgvector:pg16
    # before any SQL runs. PostgreSQL 16 and pgvector come from the runner's own
    # apt sources, the major version and extension the Database job replays into.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - name: Check out exact same-repository PR or main head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Start a job-owned PostgreSQL 16 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || true
          port="$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $3 }')"
          [[ "$port" =~ ^[0-9]+$ ]]
          [[ "$(pg_lsclusters --no-header | awk '$1 == 16 && $2 == "main" { print $4 }')" == online ]]
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          sudo -u postgres psql -X -p "$port" -v ON_ERROR_STOP=1 -q \
            -c "alter user postgres password 'ci-only-not-a-production-secret'"

      - name: Create the database
        run: |
          [[ "$(PGDATABASE=postgres psql -X -Atc 'show server_version_num')" == 16* ]]
          PGDATABASE=postgres psql -X -c 'create database bubaly'

      - name: Replay every runnable migration
        run: bash docs/audit/pg-bootstrap.sh

      - name: The released schema takes ballots on a closed vote
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runs bash steps with -e, so the expected failure is caught
          # here rather than ending the step before it is examined.
          status=0
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-closed-vote-takes-no-more-ballots-check.sql 2>&1)" || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo '::error::the held probe passed on the released schema, so it can no longer see the defect'
            exit 1
          fi
          if grep -qE 'CONTROL|PRECONDITION' <<<"$out"; then
            echo '::error::a control or precondition failed on the released schema, not only the defect'
            exit 1
          fi
          for expected in \
            "the child cast a ballot on a closed meal vote (OK 1)" \
            "the child voted on a closed poll (OK 1)" \
            "the child voted on a poll past its closes_at (OK 1)" \
            "0525's guard is not in place on meal_vote_ballots, family_poll_votes"; do
            if ! grep -qF "$expected" <<<"$out"; then
              echo "::error::the held probe failed, but not on: $expected"
              exit 1
            fi
          done

      - name: Apply the held migration, twice
        run: |
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0525_a_closed_vote_takes_no_more_ballots.sql
          psql -X -v ON_ERROR_STOP=1 -q -f supabase/reserved/0525_a_closed_vote_takes_no_more_ballots.sql

      - name: A closed vote takes no more ballots
        shell: bash
        run: |
          set -euo pipefail
          out="$(psql -X -v ON_ERROR_STOP=1 -q -f docs/audit/reserved/a-closed-vote-takes-no-more-ballots-check.sql 2>&1)"
          printf '%s\n' "$out"
          grep -qF 'a-closed-vote-takes-no-more-ballots: OK' <<<"$out"

      - name: The released probes over the ballot tables still hold
        shell: bash
        run: |
          set -euo pipefail
          for probe in \
            docs/audit/family-scoped-index-check.sql \
            docs/audit/gated-write-tables-check.sql \
            docs/audit/meal-ballot-is-per-option-check.sql \
            docs/audit/poll-single-choice-check.sql \
            docs/audit/rls-sweep-check.sql \
            docs/audit/vote-owner-check.sql; do
            echo "== $probe"
            psql -X -v ON_ERROR_STOP=1 -q -f "$probe"
          done
