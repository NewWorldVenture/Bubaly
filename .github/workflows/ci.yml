name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Migration filename audit
        run: npm run db:audit:migrations

      # Catches the failures typechecking cannot: a table, column, rpc or API
      # route a query names that does not exist, and tables left deny-all by
      # RLS-with-no-policy. All of those compile fine and surface in production
      # as a page that renders empty.
      - name: Supabase query audit
        run: npm run db:audit:queries

      - name: Marketing asset audit
        run: npm run marketing:audit:assets

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Build BEFORE Typecheck, deliberately. next.config.mjs turns off the
      # type-check and lint passes inside `next build` — they were a duplicate
      # of the two steps here, and the one worker that ran them peaked at
      # 4,471 MB against the 4,096 MB cap below, which is where a Vercel
      # deployment died. Building first still generates .next/types/**, which
      # tsconfig.json includes, so the Typecheck step that follows validates
      # every route signature as well as the app — the same coverage the build
      # used to give, in its own process instead of alongside webpack's.
      - name: Build
        run: npm run build
        env:
          # Webpack alone; the type-check moved to its own step below.
          NODE_OPTIONS: --max-old-space-size=4096
          # Dummy values so static generation doesn't crash on missing config.
          # Real data is fetched at runtime; build-time fetches fail closed
          # (e.g. getPublicStats() returns zeros), so these are safe placeholders.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          NEXT_PUBLIC_APP_URL: https://example.com

      - name: Typecheck
        run: npm run typecheck
        env:
          # Checks app + tests + the .next/types route types the Build step
          # just generated; needs the same schema/type heap as before.
          NODE_OPTIONS: --max-old-space-size=4096

  mobile:
    # The Expo app (mobile/) is its own npm project sharing design/tokens.json
    # with the web app. Typecheck + config validation is enough to gate PRs;
    # native binaries are produced with EAS Build (see docs/mobile.md).
    name: Mobile (Expo) · Typecheck · Config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

  database:
    # §45. The boundary probes in docs/audit/ have existed for a while and
    # NOTHING has ever run them: `tests/rls-isolation-sweep.test.ts` only reads
    # the probe file and checks it still contains its assertions. So a family's
    # rows were protected by policies CI never tried to break. This repo has
    # lived that failure once already — `0118` exists because production tables
    # had RLS on with their family policies missing, and pages silently returned
    # zero rows.
    #
    # This job replays every migration into a real Postgres and then runs every
    # probe against it. The runner GLOBS docs/audit/*-check.sql, so a probe added
    # tomorrow is enforced tomorrow without anyone editing this file.
    #
    # pgvector/pgvector:pg16, not postgres:16 — 0237 does `create extension
    # vector`, and a stock image cannot apply it.
    name: Database (migration replay · RLS boundary probes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # Throwaway, job-owned, and reachable only from this ephemeral runner.
          # This job connects to nothing else: no repository secrets, no database
          # URL, no production. (move-date-recalculation-runtime.yml goes further
          # and maps no host port at all, driving psql inside the container over
          # its Unix socket. That posture is deliberate there; it is not adopted
          # here because the same scripts have to keep running against a plain
          # local Postgres for anyone reproducing a failure by hand.)
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-not-a-production-secret
      PGDATABASE: bubaly
    steps:
      - uses: actions/checkout@v4

      # The runner image ships a Postgres client, but this job is the one place
      # in CI that depends on it, and a missing binary would read as a database
      # failure rather than a toolchain one. Make it explicit and cheap.
      - name: Ensure the Postgres client is present
        run: |
          psql --version || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          }
          psql --version

      - name: Create the database
        run: PGDATABASE=postgres psql -c 'create database bubaly'

      # Shims, all migrations, the anchor account and SEED_ALL — the same script
      # docs/audit/verify-pg.sh runs, so what CI proves is what a person
      # reproduces locally. Exits non-zero if ANY migration fails to apply.
      - name: Replay every migration
        run: bash docs/audit/pg-bootstrap.sh

      # Each probe asserts with RAISE EXCEPTION under ON_ERROR_STOP=1. Covers
      # both directions of the 0118 failure: another family reading your rows,
      # and your own family losing access to them.
      - name: Boundary probes
        run: bash docs/audit/run-probes.sh

  e2e:
    # `npm run test:e2e` runs playwright with no project filter, so ALL projects
    # execute here — including the mobile device matrix (iphone-se / iphone / pixel
    # / ipad, Chromium-emulated) added in playwright.config.ts. The mobile projects
    # run the mobile-invariant + horizontal-overflow + public-route specs, so every
    # PR is gated on: no horizontal overflow and no sub-16px inputs at real device
    # viewports. (WebKit-native runs are opt-in via PW_WEBKIT=1 where installed.)
    name: E2E (public · a11y · authenticated · mobile device matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # The 17 historical duplicate versions were renamed in the repo itself, so
      # this is now a NO-OP that renames nothing. It is kept as a safety net: if
      # a duplicate is ever reintroduced, this gives the pair unique versions in
      # THIS disposable checkout, preserving apply order, rather than letting
      # `supabase start` die on schema_migrations_pkey with no explanation.
      # (db:audit:migrations above is the real gate and fails first.)
      - name: De-duplicate migration versions for the isolated apply
        run: node scripts/ci-dedupe-migration-versions.mjs
        env:
          CI: '1'

      - name: Start isolated Supabase
        run: supabase start

      - name: Verify home brief kind uniqueness in disposable PostgreSQL
        timeout-minutes: 3
        run: node scripts/ci-home-brief-kind-runtime.mjs
        env:
          BUBALY_0261_RUNTIME: '1'

      - name: Export local Supabase credentials
        shell: bash
        run: |
          set -a
          source <(supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.secret_key=SUPABASE_SECRET_KEY)
          set +a
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          echo "::add-mask::$SUPABASE_SECRET_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3107" >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Diagnostic only (never fails): key shapes + PostgREST status/body for
      # every header combination, so a red schema audit explains itself here.
      - name: Probe isolated REST auth
        run: node scripts/probe-supabase-rest.mjs

      - name: Verify isolated Auth APIs
        run: npm run db:audit:auth

      - name: Verify isolated schema capabilities
        run: npm run db:audit:schema

      # The isolated database has the migrations' blog / landing / SEO rows but
      # no canonical marketing_pages — production got those from
      # `marketing:backfill:pages --apply`. Run the same offline backfill so the
      # verification below checks the same state as production.
      - name: Backfill canonical marketing pages
        run: npm run marketing:backfill:pages -- --apply

      - name: Verify marketing platform schema
        run: npm run marketing:verify:remote

      - name: Verify marketing asset provenance
        run: npm run marketing:verify:assets:remote

      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          # run-e2e.mjs runs `next build` first — same heap need as the Build step.
          NODE_OPTIONS: --max-old-space-size=4096
          E2E_AUTHENTICATED: '1'
          # Each durable-session test owns a unique local-only account/household.
          E2E_DURABLE_SESSION: '1'
          # Synthetic, disposable-only input shared by the child fixture/server.
          CHILD_LOGIN_SECRET: ci-only-child-pin-session-fixture
          # Signed Guardian ingress against the disposable server only. A token
          # alone cannot configure outbound Twilio; the fixture refuses real keys.
          TWILIO_AUTH_TOKEN: ci-only-guardian-signed-ingress-fixture
          # Authenticates only the disposable server's recovery job.
          CRON_SECRET: ci-only-guardian-recovery-fixture
          ANTHROPIC_API_KEY: ''
          OPENAI_API_KEY: ''
          NEXT_PUBLIC_SITE_URL: http://localhost:3107
          E2E_AUTH_EMAIL: bubaly-e2e-${{ github.run_id }}-${{ github.run_attempt }}@example.test
          E2E_AUTH_PASSWORD: Bubaly-E2E-2026!
          # tests/e2e/concierge.spec.ts drives "Plan our week" through the real
          # request → plan → run path with the scripted model
          # (lib/ai/provider-stub.ts, scripts under tests/ai-eval/scripts). The
          # server runs with NODE_ENV=production under `next start`, so the
          # stub needs the explicit e2e opt-in as well; a Vercel production
          # deployment ignores both.
          AI_PROVIDER_STUB: '1'
          E2E_PROVIDER_STUB: '1'

      # Retain only isolated-fixture DOM snapshots and screenshots on failure.
      # Never upload traces, auth state, environment files, logs, or HTML reports.
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/error-context.md
            test-results/**/*.png
            !test-results/**/trace.zip
            !test-results/*durable-session*/**
            !test-results/**/storageState*
            !test-results/**/storage-state*
            !test-results/**/auth.json
            !test-results/**/auth/**
            !test-results/**/.auth/**
            !test-results/**/.env*
            !test-results/**/*.log
            !test-results/**/logs/**
            !test-results/**/*.html
            !test-results/**/playwright-report/**
          include-hidden-files: false
          retention-days: 3
          if-no-files-found: ignore

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
