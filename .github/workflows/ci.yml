name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Migration filename audit
        run: npm run db:audit:migrations

      - name: Marketing asset audit
        run: npm run marketing:audit:assets

      - name: Typecheck
        run: npm run typecheck
        env:
          # The standalone check needs the same schema/type heap as next build.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # `next build` type-checks every route plus the generated .next/types
          # in one worker; the 435-table types file pushes that past Node's
          # default ~2 GB heap on the runner (OOM at "checking validity of
          # types"). 4 GB fits the 7 GB runner with room for webpack.
          NODE_OPTIONS: --max-old-space-size=4096
          # Dummy values so static generation doesn't crash on missing config.
          # Real data is fetched at runtime; build-time fetches fail closed
          # (e.g. getPublicStats() returns zeros), so these are safe placeholders.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          NEXT_PUBLIC_APP_URL: https://example.com

  mobile:
    # The Expo app (mobile/) is its own npm project sharing design/tokens.json
    # with the web app. Typecheck + config validation is enough to gate PRs;
    # native binaries are produced with EAS Build (see docs/mobile.md).
    name: Mobile (Expo) · Typecheck · Config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

  e2e:
    # `npm run test:e2e` runs playwright with no project filter, so ALL projects
    # execute here — including the mobile device matrix (iphone-se / iphone / pixel
    # / ipad, Chromium-emulated) added in playwright.config.ts. The mobile projects
    # run the mobile-invariant + horizontal-overflow + public-route specs, so every
    # PR is gated on: no horizontal overflow and no sub-16px inputs at real device
    # viewports. (WebKit-native runs are opt-in via PW_WEBKIT=1 where installed.)
    name: E2E (public · a11y · authenticated · mobile device matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # The repo keeps a few historically duplicated migration versions (see
      # KNOWN_DUPLICATE_MIGRATIONS); the CLI's schema_migrations table rejects
      # the second file of each pair. Give them unique versions in THIS
      # disposable checkout only, preserving apply order (verified by the script
      # + tests/ci-dedupe-migration-versions.test.ts). Never committed.
      - name: De-duplicate migration versions for the isolated apply
        run: node scripts/ci-dedupe-migration-versions.mjs
        env:
          CI: '1'

      - name: Start isolated Supabase
        run: supabase start

      - name: Export local Supabase credentials
        shell: bash
        run: |
          set -a
          source <(supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.secret_key=SUPABASE_SECRET_KEY)
          set +a
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          echo "::add-mask::$SUPABASE_SECRET_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3107" >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Diagnostic only (never fails): key shapes + PostgREST status/body for
      # every header combination, so a red schema audit explains itself here.
      - name: Probe isolated REST auth
        run: node scripts/probe-supabase-rest.mjs

      - name: Verify isolated Auth APIs
        run: npm run db:audit:auth

      - name: Verify isolated schema capabilities
        run: npm run db:audit:schema

      # The isolated database has the migrations' blog / landing / SEO rows but
      # no canonical marketing_pages — production got those from
      # `marketing:backfill:pages --apply`. Run the same offline backfill so the
      # verification below checks the same state as production.
      - name: Backfill canonical marketing pages
        run: npm run marketing:backfill:pages -- --apply

      - name: Verify marketing platform schema
        run: npm run marketing:verify:remote

      - name: Verify marketing asset provenance
        run: npm run marketing:verify:assets:remote

      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          # run-e2e.mjs runs `next build` first — same heap need as the Build step.
          NODE_OPTIONS: --max-old-space-size=4096
          E2E_AUTHENTICATED: '1'
          E2E_AUTH_EMAIL: bubaly-e2e-${{ github.run_id }}-${{ github.run_attempt }}@example.test
          E2E_AUTH_PASSWORD: Bubaly-E2E-2026!
          # tests/e2e/concierge.spec.ts drives "Plan our week" through the real
          # request → plan → run path with the scripted model
          # (lib/ai/provider-stub.ts, scripts under tests/ai-eval/scripts). The
          # server runs with NODE_ENV=production under `next start`, so the
          # stub needs the explicit e2e opt-in as well; a Vercel production
          # deployment ignores both.
          AI_PROVIDER_STUB: '1'
          E2E_PROVIDER_STUB: '1'

      # Retain only isolated-fixture DOM snapshots and screenshots on failure.
      # Never upload traces, auth state, environment files, logs, or HTML reports.
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/error-context.md
            test-results/**/*.png
            !test-results/**/trace.zip
            !test-results/**/storageState*
            !test-results/**/storage-state*
            !test-results/**/auth.json
            !test-results/**/auth/**
            !test-results/**/.auth/**
            !test-results/**/.env*
            !test-results/**/*.log
            !test-results/**/logs/**
            !test-results/**/*.html
            !test-results/**/playwright-report/**
          include-hidden-files: false
          retention-days: 3
          if-no-files-found: ignore

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
