name: Cron dispatch

# Drives the app's /api/cron/* routes at their real cadence from GitHub
# Actions. Vercel's Hobby plan only allows once-per-day cron jobs and FAILS
# the deployment when vercel.json schedules anything more frequent, so
# vercel.json now holds daily-safe schedules and this workflow supplies the
# sub-daily ones (every 5 / 15 minutes, hourly, every 2–6 hours, 2–3×/day).
# The route → schedule table lives in scripts/cron-dispatch.mjs.
#
# Requirements (repository Settings):
#   - Secret  CRON_SECRET     — the same value as the Vercel env var CRON_SECRET
#   - Variable CRON_BASE_URL  — optional, defaults to https://www.bubaly.com
# Missing/blank CRON_SECRET fails the job before any dispatch. CLI --dry-run is
# the explicit credential-free preview. Malformed base URLs or unregistered
# manual routes also fail before credentials can be sent.
#
# Cost lever: the tick ASKS for every 5 minutes (~290 short runs/day). It does
# not get it — the first 95 runs of this workflow averaged one every 209
# minutes, ~7/day, and never once came 5 minutes apart. Slowing the request to
# '*/15 * * * *' would therefore save little, because the request is not what
# is being billed or delivered; raising delivery needs a scheduler that keeps
# its word (Vercel Pro's native sub-daily crons) rather than a different cron
# string here. See scripts/cron-dispatch.mjs for the per-route shortfall.
#
# Catch-up: a tick that arrives hours late used to evaluate only its own last
# five minutes, so every sub-daily firing in the gap was lost. The tick now asks
# the Actions API for the previous successful SCHEDULED run of this workflow and
# passes its start as CRON_SINCE; the dispatcher evaluates every minute since
# then (never less than five, capped at a day, daily routes left to Vercel, one
# call per route however many of its minutes fell in the gap). If the lookup
# FAILS the tick still dispatches its five-minute window, says so, and then
# marks itself failed on purpose: only a `status=success` run is taken as a
# boundary, and a tick that did not know where the previous one stopped must
# not become the place the next one starts from — the minutes before it would
# be lost for good (review on #699, 5969190760). A lookup that succeeds and
# finds no previous scheduled success (the first tick ever) is not a failure:
# it starts the chain. This recovers the firing, not the rate — see the
# dispatcher header.
# On Vercel Pro, move the schedules back into vercel.json and disable this.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      route:
        description: 'Run one route now (e.g. /api/cron/notifications); leave empty to run whatever is due'
        required: false
        default: ''

permissions:
  contents: read
  # Listing this workflow's own runs (the catch-up boundary) needs actions: read.
  actions: read

concurrency:
  group: cron-dispatch
  cancel-in-progress: false

jobs:
  tick:
    # Never fire from forks or the old repository name.
    if: github.repository == 'NewWorldVenture/Bubaly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # .nvmrc decides the Node version for every job in this repository, so
          # this sparse checkout has to fetch it alongside the script it runs.
          sparse-checkout: |
            scripts/cron-dispatch.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Find the previous successful tick (catch-up boundary)
        id: previous
        env:
          # The job's GITHUB_TOKEN; `gh` reads it from GH_TOKEN.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # The previous SCHEDULED success, not any success: a manual single-route
          # run dispatches one route, so taking it as the boundary would skip every
          # other route due since the real previous tick. The current run is
          # excluded by id. The dispatcher never narrows below its fixed window, so
          # a boundary that is too recent costs nothing, and one that is too old is
          # capped there.
          #
          # Failure here must not stop the dispatch: the dispatcher then runs its
          # fixed five-minute window exactly as it did before catch-up. But it must
          # not be forgotten either. Two outcomes look alike and are not: the API
          # answered and there was no previous scheduled success (the first tick
          # ever, which starts the chain), and the API did NOT answer — a 403, an
          # outage, an unexpected shape. The second is recorded as `lookup=failed`,
          # and the last step turns it into a failed run, because only a successful
          # run is ever taken as a boundary: a tick that did not know where the
          # previous one stopped would otherwise become the place the next one
          # starts from, and every minute before it would be lost for good.
          lookup=ok
          since=''
          # One answer per outcome, so the two look-alikes cannot be confused:
          # `none` means the API answered and no previous scheduled success
          # exists (the first tick ever); a timestamp is the boundary; anything
          # else — a selected run whose start is null or missing, a body of
          # another shape (jq's own error on a body without `workflow_runs`
          # fails the command, like a 403 does) — is unusable.
          if answer="$(gh api \
            "repos/${REPO}/actions/workflows/cron-dispatch.yml/runs?status=success&event=schedule&per_page=5" \
            --jq '([.workflow_runs[] | select(.id != (env.RUN_ID | tonumber))][0]) as $run
                  | if $run == null then "none"
                    elif ($run.run_started_at | type) == "string" then $run.run_started_at
                    else "unusable" end')"; then
            if [[ "$answer" == none ]]; then
              echo "No previous successful scheduled tick is recorded; this one starts the chain with the fixed five-minute window."
            elif [[ "$answer" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
              && started="$(date -u -d "$answer" +%s 2>/dev/null)" && (( started <= $(date -u +%s) )); then
              # The same two tests the dispatcher's tickWindow applies — a real
              # timestamp, not in the future — so a boundary this step accepts
              # is one the dispatcher will use, never one it silently ignores
              # while the run goes on to finish green.
              since="$answer"
              echo "Previous successful tick started at ${since}; catching up from there."
            else
              echo "The previous tick's start was unusable (got '${answer:0:80}'); dispatching the fixed five-minute window, and this tick will not be a boundary."
              lookup=failed
            fi
          else
            echo "The previous-tick lookup failed; dispatching the fixed five-minute window, and this tick will not be a boundary."
            lookup=failed
          fi
          echo "since=${since}" >> "$GITHUB_OUTPUT"
          echo "lookup=${lookup}" >> "$GITHUB_OUTPUT"

      - name: Validate configuration and dispatch due routes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_BASE_URL: ${{ vars.CRON_BASE_URL }}
          CRON_SINCE: ${{ steps.previous.outputs.since }}
          ROUTE: ${{ github.event.inputs.route }}
        run: |
          if [ -n "$ROUTE" ]; then
            node scripts/cron-dispatch.mjs --route "$ROUTE"
          else
            node scripts/cron-dispatch.mjs
          fi

      - name: A tick that could not find its boundary is not one
        # After the dispatch, so the routes due this tick were still called. The
        # run is then failed on purpose: the boundary step reads only runs with
        # status=success, so a green run here would be the next tick's boundary
        # and the gap before it could never be caught up. The next green tick
        # catches up from the last real success instead — repeating this tick's
        # five minutes for routes that are idempotent sweeps, losing nothing.
        if: steps.previous.outputs.lookup == 'failed'
        run: |
          echo "::error::The catch-up boundary could not be read. This tick dispatched its fixed five-minute window and is marked failed on purpose, so it is not taken as the next tick's boundary."
          exit 1
